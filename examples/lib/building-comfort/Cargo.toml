[package]
name = "building-comfort-dashboard"
version = "0.1.0"
edition = "2021"
publish = false
description = "DrasiLib example: Building comfort monitoring with SSE real-time dashboard"

# Standalone workspace - not part of parent workspace
[workspace]

[dependencies]
drasi-lib = { path = "../../../lib" }
drasi-source-http = { path = "../../../components/sources/http" }
drasi-reaction-sse = { path = "../../../components/reactions/sse" }
drasi-bootstrap-scriptfile = { path = "../../../components/bootstrappers/scriptfile" }

tokio = { version = "1.6", features = ["full"] }
anyhow = "1.0"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
env_logger = "0.10.0"
log = "0.4"
serde_json = "1.0"

[[bin]]
name = "building-comfort-dashboard"
path = "main.rs"
